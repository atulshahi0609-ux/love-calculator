<!DOCTYPE html>
<html>

<head>
    <title>Love Calculator ❤️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;

            background: linear-gradient(135deg, #ff758c, #ff7eb3, #8e44ad);
            overflow: hidden;
        }

        /* Background hearts */
        .heart {
            position: absolute;
            color: rgba(255, 255, 255, 0.5);
            font-size: 30px;
            animation: float 6s linear infinite;
        }

        .heart:nth-child(1) {
            left: 10%;
            animation-delay: 0s;
        }

        .heart:nth-child(2) {
            left: 30%;
            animation-delay: 2s;
        }

        .heart:nth-child(3) {
            left: 55%;
            animation-delay: 1s;
        }

        .heart:nth-child(4) {
            left: 80%;
            animation-delay: 3s;
        }

        @keyframes float {
            0% {
                bottom: -50px;
                transform: scale(1);
            }

            100% {
                bottom: 110%;
                transform: scale(1.5);
            }
        }

        /* Main card */
        .card {
            width: 380px;
            padding: 35px;
            text-align: center;

            background: rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(15px);

            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 25px;

            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);

            color: white;

            animation: cardAppear 1s ease;
        }

        @keyframes cardAppear {
            0% {
                opacity: 0;
                transform: scale(0.7);
            }

            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        h1 {
            margin-bottom: 30px;
            font-size: 32px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 8px;
            font-size: 16px;
        }

        input {
            width: 100%;
            padding: 13px;

            border: none;
            border-radius: 12px;

            outline: none;
            font-size: 16px;

            background: rgba(255, 255, 255, 0.9);
        }

        button {
            margin-top: 25px;
            padding: 13px 30px;

            border: none;
            border-radius: 25px;

            background: #ff1744;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.08);
            background: #e91e63;
        }

        /* Result */
        .result {
            margin-top: 30px;
            padding: 20px;

            background: rgba(255, 255, 255, 0.2);
            border-radius: 18px;

            animation: resultAppear 0.8s ease;
        }

        @keyframes resultAppear {
            0% {
                opacity: 0;
                transform: translateY(20px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .percentage {
            font-size: 28px;
            font-weight: bold;
        }
    </style>

</head>

<body>

    <!-- Floating hearts -->

    <div class="heart">❤️</div>
    <div class="heart">💕</div>
    <div class="heart">💗</div>
    <div class="heart">❤️</div>


    <!-- Main card -->

    <div class="card">

        <h1>❤️ Love Calculator ❤️</h1>

        <form method="POST">

            <label>Your Name</label>
            <input type="text" name="your_name" placeholder="Enter your name" required>

            <label>Her Name</label>
            <input type="text" name="her_name" placeholder="Enter her name" required>

            <button type="submit">
                Check Love ❤️
            </button>

        </form>


        {% if love %}

        <div class="result">

            <h2>
                {{ your_name }} ❤️ {{ her_name }}
            </h2>

            <div class="percentage">
                💕 {{ love }}% Love 💕
            </div>

        </div>

        {% endif %}

    </div>

</body>

</html>
