<!DOCTYPE html>
<html>

<head>

    <title>Love Calculator ❤️</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #ff758c,
                #ff7eb3,
                #8e44ad
            );

            overflow: hidden;
        }

        /* Floating Hearts */

        .heart {
            position: absolute;
            color: rgba(255, 255, 255, 0.5);
            font-size: 30px;

            animation: float 6s linear infinite;
        }

        .heart:nth-child(1) {
            left: 10%;
            animation-delay: 0s;
        }

        .heart:nth-child(2) {
            left: 30%;
            animation-delay: 2s;
        }

        .heart:nth-child(3) {
            left: 55%;
            animation-delay: 1s;
        }

        .heart:nth-child(4) {
            left: 80%;
            animation-delay: 3s;
        }

        @keyframes float {

            0% {
                bottom: -50px;
                transform: scale(1);
            }

            100% {
                bottom: 110%;
                transform: scale(1.5);
            }

        }


        /* Main Card */

        .card {
            width: 380px;
            max-width: 90%;

            padding: 35px;

            text-align: center;

            background: rgba(255, 255, 255, 0.18);

            backdrop-filter: blur(15px);

            border: 1px solid rgba(255, 255, 255, 0.3);

            border-radius: 25px;

            box-shadow:
                0 20px 50px
                rgba(0, 0, 0, 0.25);

            color: white;

            animation: cardAppear 1s ease;

            position: relative;

            z-index: 10;
        }

        @keyframes cardAppear {

            0% {
                opacity: 0;
                transform: scale(0.7);
            }

            100% {
                opacity: 1;
                transform: scale(1);
            }

        }


        /* Heading */

        h1 {
            margin-bottom: 30px;
            font-size: 32px;
        }


        /* Labels */

        label {
            display: block;

            margin-top: 15px;
            margin-bottom: 8px;

            font-size: 16px;
        }


        /* Inputs */

        input {
            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 12px;

            outline: none;

            font-size: 16px;

            background: rgba(
                255,
                255,
                255,
                0.9
            );
        }


        /* Button */

        button {
            margin-top: 25px;

            padding: 13px 30px;

            border: none;

            border-radius: 25px;

            background: #ff1744;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.08);

            background: #e91e63;
        }


        /* Result */

        .result {
            margin-top: 30px;

            padding: 20px;

            background: rgba(
                255,
                255,
                255,
                0.2
            );

            border-radius: 18px;

            animation:
                resultAppear
                0.8s ease;
        }

        @keyframes resultAppear {

            0% {
                opacity: 0;

                transform:
                    translateY(20px);
            }

            100% {
                opacity: 1;

                transform:
                    translateY(0);
            }

        }


        /* Love Percentage */

        .percentage {
            font-size: 30px;

            font-weight: bold;

            animation:
                heartbeat
                1.2s infinite;
        }

        @keyframes heartbeat {

            0% {
                transform: scale(1);
            }

            25% {
                transform: scale(1.08);
            }

            40% {
                transform: scale(1);
            }

            60% {
                transform: scale(1.08);
            }

            100% {
                transform: scale(1);
            }

        }


        /* Romantic Message */

        .love-message {
            margin-top: 15px;

            font-size: 18px;

            font-weight: bold;

            animation:
                messageAppear
                1s ease;
        }

        @keyframes messageAppear {

            0% {
                opacity: 0;

                transform:
                    scale(0.7);
            }

            100% {
                opacity: 1;

                transform:
                    scale(1);
            }

        }


        /* Built By */

        .built-by {
            margin-top: 25px;

            font-size: 14px;

            opacity: 0.9;
        }


        /* 🌹 Falling Roses */

        .rose {
            position: fixed;

            top: -50px;

            font-size: 30px;

            animation:
                roseFall
                5s linear forwards;

            pointer-events: none;

            z-index: 999;
        }

        @keyframes roseFall {

            0% {
                top: -50px;

                transform:
                    rotate(0deg);

                opacity: 1;
            }

            100% {
                top: 110vh;

                transform:
                    rotate(360deg);

                opacity: 0;
            }

        }


        /* ✨ Sparkles */

        .sparkle {
            position: fixed;

            pointer-events: none;

            z-index: 998;

            font-size: 22px;

            animation:
                sparkleAnimation
                2s ease-out forwards;
        }

        @keyframes sparkleAnimation {

            0% {
                opacity: 1;

                transform:
                    scale(0);
            }

            50% {
                opacity: 1;

                transform:
                    scale(1.5);
            }

            100% {
                opacity: 0;

                transform:
                    scale(0);
            }

        }


        /* 💖 100% Special Effect */

        .true-love {
            animation:
                trueLove
                1s infinite;
        }

        @keyframes trueLove {

            0% {
                box-shadow:
                    0 0 10px
                    rgba(
                        255,
                        255,
                        255,
                        0.5
                    );
            }

            50% {
                box-shadow:
                    0 0 40px
                    rgba(
                        255,
                        255,
                        255,
                        0.9
                    );
            }

            100% {
                box-shadow:
                    0 0 10px
                    rgba(
                        255,
                        255,
                        255,
                        0.5
                    );
            }

        }


        /* 📱 Mobile */

        @media (max-width: 500px) {

            .card {
                padding: 25px;
            }

            h1 {
                font-size: 26px;
            }

            .percentage {
                font-size: 26px;
            }

        }

    </style>

</head>


<body>


    <!-- Floating Hearts -->

    <div class="heart">❤️</div>

    <div class="heart">💕</div>

    <div class="heart">💗</div>

    <div class="heart">❤️</div>


    <!-- Main Card -->

    <div
        class="card"
        id="mainCard"
    >

        <h1>
            ❤️ Love Calculator ❤️
        </h1>


        <form method="POST">

            <label>
                Your Name
            </label>

            <input
                type="text"
                name="your_name"
                placeholder="Enter your name"
                required
            >


            <label>
                Her Name
            </label>

            <input
                type="text"
                name="her_name"
                placeholder="Enter her name"
                required
            >


            <button type="submit">
                Check Love ❤️
            </button>

        </form>


        {% if love %}

        <div class="result">

            <h2>
                {{ your_name }}
                ❤️
                {{ her_name }}
            </h2>


            <div class="percentage">
                💕 {{ love }}% Love 💕
            </div>


            <p class="love-message">
                {{ message }}
            </p>


            <!-- Try Again -->

            <form method="GET">

                <button type="submit">
                    🔄 Try Again
                </button>

            </form>

        </div>


        <!-- 🌹 Rose Rain + ✨ Sparkles -->

        <script>

            /* 🌹 Roses */

            for (
                let i = 0;
                i < 35;
                i++
            ) {

                let rose =
                    document.createElement("div");

                rose.className = "rose";

                rose.innerHTML = "🌹";

                rose.style.left =
                    Math.random() * 100 + "vw";

                rose.style.animationDelay =
                    Math.random() * 3 + "s";

                rose.style.fontSize =
                    (
                        20 +
                        Math.random() * 25
                    ) + "px";

                document.body.appendChild(rose);

            }


            /* ✨ Sparkles */

            for (
                let i = 0;
                i < 25;
                i++
            ) {

                let sparkle =
                    document.createElement("div");

                sparkle.className = "sparkle";

                sparkle.innerHTML = "✨";

                sparkle.style.left =
                    Math.random() * 100 + "vw";

                sparkle.style.top =
                    Math.random() * 100 + "vh";

                sparkle.style.animationDelay =
                    Math.random() * 2 + "s";

                document.body.appendChild(
                    sparkle
                );

            }


            /* 💖 100% Special Effect */

            {% if love == 100 %}

            document
                .getElementById("mainCard")
                .classList
                .add("true-love");

            {% endif %}

        </script>

        {% endif %}


        <!-- Built By -->

        <p class="built-by">
            Built by Atul Shahi ❤️
        </p>


    </div>


</body>

</html>
